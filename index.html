<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>พัคแชยอง Hair Studio</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f6f6f6;color:#222;margin:0}header{background:#171717;color:white;padding:22px 16px}h1{font-size:22px;margin:0}header p{margin:6px 0 0;color:#ddd}.wrap{max-width:720px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #0000000a}h2{font-size:18px;margin:0 0 14px}label{display:block;margin:12px 0 5px;font-weight:600}input,select,button{font:inherit;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:white}button{background:#171717;color:white;border:0;font-weight:700;margin-top:12px}.secondary{background:#eee;color:#222}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f5f5f5;border-radius:12px;padding:12px}.stat b{display:block;font-size:21px;margin-top:5px}small{color:#666}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:10px 0;align-items:center}.row button{width:auto;padding:7px 10px;margin:0;background:#eee;color:#333}.muted{color:#777}nav{display:flex;gap:7px;margin-bottom:14px}nav button{margin:0;background:#eee;color:#222}nav button.active{background:#171717;color:#fff}.hidden{display:none}</style></head><body>
<header><h1>พัคแชยอง Hair Studio 💈</h1><p>บันทึกยอดร้าน • เวอร์ชันทดลอง</p></header><main class="wrap">
<nav><button id="tab-entry" class="active" onclick="tab('entry')">บันทึก</button><button id="tab-summary" onclick="tab('summary')">สรุปยอด</button><button id="tab-history" onclick="tab('history')">ประวัติ</button></nav>
<section id="entry"><div class="card"><h2>บันทึกลูกค้า / รายรับ</h2><label>วันที่</label><input type="date" id="saleDate"><label>ประเภทลูกค้า / ทรงผม</label><select id="service"><option value="100">เด็กเล็ก–ป.6 • 100 บาท</option><option value="120">ม.ต้น • 120 บาท</option><option value="140">ม.ปลาย • 140 บาท</option><option value="140">ผู้ใหญ่รองทรงสั้น • 140 บาท</option><option value="150">ผู้ใหญ่ซอยบนยาว • 150 บาท</option><option value="150">แฟชั่น • 150 บาท</option></select><label>จำนวนลูกค้า (คน)</label><input type="number" id="qty" value="1" min="1" step="1"><label>ยอดเงินรวม (บาท)</label><input type="number" id="amount" min="0" step="0.01"><label>ช่องทางชำระเงิน</label><select id="payment"><option value="cash">เงินสด</option><option value="transfer">เงินโอน</option></select><button onclick="addSale()">บันทึกรายรับ</button></div>
<div class="card"><h2>บันทึกรายจ่าย</h2><label>วันที่</label><input type="date" id="expenseDate"><label>รายการ</label><input id="expenseName" placeholder="เช่น ค่าไฟร้าน"><label>จำนวนเงิน (บาท)</label><input type="number" id="expenseAmount" min="0.01" step="0.01"><button onclick="addExpense()">บันทึกรายจ่าย</button></div></section>
<section id="summary" class="hidden"><div class="card"><h2>สรุปยอด</h2><label>เลือกเดือน</label><input type="month" id="month" onchange="render()"><div class="grid" style="margin-top:15px"><div class="stat">ลูกค้า<b id="heads">0 คน</b></div><div class="stat">รายรับรวม<b id="income">0 ฿</b></div><div class="stat">เงินสด<b id="cash">0 ฿</b></div><div class="stat">เงินโอน<b id="transfer">0 ฿</b></div><div class="stat">รายจ่าย<b id="expense">0 ฿</b></div><div class="stat">รายรับหักรายจ่าย<b id="net">0 ฿</b></div></div><h2 style="margin-top:22px">ยอดรายวันในเดือน</h2><div id="days"></div></div></section>
<section id="history" class="hidden"><div class="card"><h2>ประวัติรายการ</h2><div id="records"></div><button class="secondary" onclick="exportData()">สำรองข้อมูลเป็นไฟล์ JSON</button><small>ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น ควรสำรองข้อมูลเป็นประจำ</small><label>นำเข้าข้อมูลสำรอง JSON</label><input type="file" accept=".json,application/json" onchange="importData(event)"></div></section></main>
<script>
const KEY='pakchaeyoung_records_v1';let data=[];try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))data=v}catch(e){}
const $=id=>document.getElementById(id),today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},money=n=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2})+' ฿';
$('saleDate').value=$('expenseDate').value=today();$('month').value=today().slice(0,7);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('บันทึกไม่สำเร็จ พื้นที่เก็บข้อมูลอาจเต็ม');return false}}
function updateAmount(){$('amount').value=(Number($('service').value)*Number($('qty').value||1)).toFixed(0)}
$('service').onchange=updateAmount;$('qty').oninput=updateAmount;updateAmount();
function addSale(){let qty=Number($('qty').value),amt=Number($('amount').value);if(!$('saleDate').value||!Number.isInteger(qty)||qty<1||!Number.isFinite(amt)||amt<0||$('amount').value===''){alert('กรุณาตรวจสอบวันที่ จำนวนลูกค้า และยอดเงิน');return}data.push({id:Date.now()+Math.random(),type:'sale',date:$('saleDate').value,qty,amount:amt,payment:$('payment').value,description:$('service').selectedOptions[0].text});if(persist()){alert('บันทึกรายรับแล้ว');render()}}
function addExpense(){let amt=Number($('expenseAmount').value),name=$('expenseName').value.trim();if(!$('expenseDate').value||!name||!Number.isFinite(amt)||amt<=0){alert('กรุณากรอกรายการและจำนวนเงินให้ถูกต้อง');return}data.push({id:Date.now()+Math.random(),type:'expense',date:$('expenseDate').value,amount:amt,description:name});if(persist()){$('expenseName').value='';$('expenseAmount').value='';alert('บันทึกรายจ่ายแล้ว');render()}}
function tab(name){['entry','summary','history'].forEach(x=>{$(x).classList.toggle('hidden',x!==name);$('tab-'+x).classList.toggle('active',x===name)});render()}
function render(){let month=$('month').value,rows=data.filter(x=>x.date.startsWith(month)),sales=rows.filter(x=>x.type==='sale'),exp=rows.filter(x=>x.type==='expense'),sum=a=>a.reduce((t,x)=>t+x.amount,0),inc=sum(sales),out=sum(exp);
$('heads').textContent=sales.reduce((t,x)=>t+x.qty,0)+' คน';$('income').textContent=money(inc);$('cash').textContent=money(sum(sales.filter(x=>x.payment==='cash')));$('transfer').textContent=money(sum(sales.filter(x=>x.payment==='transfer')));$('expense').textContent=money(out);$('net').textContent=money(inc-out);
let dates=[...new Set(rows.map(x=>x.date))].sort().reverse();$('days').replaceChildren();if(!dates.length)$('days').textContent='ยังไม่มีรายการในเดือนนี้';dates.forEach(d=>{let a=rows.filter(x=>x.date===d),s=a.filter(x=>x.type==='sale'),e=a.filter(x=>x.type==='expense');let el=document.createElement('div');el.className='row';el.textContent=d+' • '+s.reduce((t,x)=>t+x.qty,0)+' คน • รับ '+money(sum(s))+' • จ่าย '+money(sum(e));$('days').append(el)});
$('records').replaceChildren();if(!data.length)$('records').textContent='ยังไม่มีรายการ';[...data].sort((a,b)=>b.date.localeCompare(a.date)).forEach(x=>{let row=document.createElement('div');row.className='row';let label=document.createElement('div');let strong=document.createElement('strong');strong.textContent=x.date+' • '+(x.type==='sale'?'รายรับ':'รายจ่าย')+' '+money(x.amount);let detail=document.createElement('small');detail.textContent=x.description+' '+(x.type==='sale'?' • '+x.qty+' คน • '+(x.payment==='cash'?'เงินสด':'เงินโอน'):'');label.append(strong,document.createElement('br'),detail);let del=document.createElement('button');del.textContent='ลบ';del.onclick=()=>{if(confirm('ยืนยันลบรายการนี้?')){data=data.filter(y=>y.id!==x.id);persist();render()}};row.append(label,del);$('records').append(row)})}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='pakchaeyoung-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(event){let f=event.target.files[0];if(!f)return;try{let arr=JSON.parse(await f.text());if(!Array.isArray(arr)||!arr.every(x=>x&&['sale','expense'].includes(x.type)&&typeof x.date==='string'&&Number.isFinite(x.amount)&&x.amount>=0))throw Error();if(confirm('นำเข้าข้อมูลสำรองและแทนที่ข้อมูลปัจจุบันทั้งหมด?')){let old=data;data=arr;if(!persist())data=old;render()}}catch(e){alert('ไฟล์สำรองไม่ถูกต้อง')}event.target.value=''}
render();
</script></body></html>
